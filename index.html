List.add('drop-target');\n      if(occ >= 0 && st.locked.indexOf(occ) >= 0) el.classList.add('drop-bad');\n    }\n  }\n}\nfunction endGesture(){\n  window.removeEventListener('pointermove', onPtrMove);\n  window.removeEventListener('pointerup', onPtrUp);\n  window.removeEventListener('pointercancel', onPtrCancel);\n  if(ptr && ptr.ghost) ptr.ghost.remove();\n  document.body.classList.remove('is-dragging');\n  document.querySelectorAll('.cell.drop-target').forEach(x => x.classList.remove('drop-target','drop-bad'));\n  document.querySelectorAll('.actor.dragging').forEach(x => x.classList.remove('dragging'));\n  document.querySelectorAll('.tok.lifted').forEach(x => x.classList.remove('lifted'));\n  ptr = null;\n}\nfunction onPtrCancel(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  const wasMark = ptr.kind === 'mark';\n  endGesture();\n  if(wasMark) afterMove(); else paint();\n}\nfunction onPtrUp(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  const g = ptr;\n  if(g.kind === 'mark'){\n    suppressUntil = Date.now() + 400;            // the press already toggled the first square\n    endGesture();\n    afterMove();\n    return;\n  }\n  if(!g.moved){ endGesture(); return; }          // plain tap: let the click handler run\n  suppressUntil = Date.now() + 400;\n  const c = cellAt(e.clientX, e.clientY);\n  endGesture();\n  if(c \u003c 0){\n    if(g.from >= 0){ st.placed[g.actor] = -1; afterMove(); }\n    else { setMsg(''); paint(); }\n    return;\n  }\n  dropActor(g.actor, c);\n}\nfunction dropActor(a, c){\n  const occ = st.placed.indexOf(c);\n  if(occ === a){ afterMove(); return; }\n  if(occ >= 0 && st.locked.indexOf(occ) >= 0){ paint(); setMsg('That square was revealed by a hint.'); return; }\n  const from = st.placed[a];\n  if(occ >= 0) st.placed[occ] = from;             // swap if moving between squares, else back to the cast list\n  st.placed[a] = c;\n  const mi = st.marks.indexOf(c); if(mi >= 0) st.marks.splice(mi, 1);\n  sel = -1;\n  afterMove();\n}\nfunction afterMove(){\n  saveProgress();\n  paint();\n  const bad = conflicts();\n  const all = st.placed.every(c => c >= 0);\n  if(bad.size) setMsg('Two actors are breaking a rule (highlighted red).');\n  else if(all){\n    const castOk = st.placed.every((c, a) => P.actors[a].films.indexOf(P.own[c]) >= 0);\n    if(castOk) win();\n    else setMsg('The grid works, but someone isn\\u2019t in the movie they\\u2019re standing on.');\n  }else if(sel >= 0) setMsg('Now tap a square for ' + P.actors[sel].name + '.');\n  else setMsg('');\n}\nfunction hint(){\n  if(done) return;\n  const a = P.actors.findIndex((_, k) => st.placed[k] !== P.solution[k]);\n  if(a \u003c 0) return;\n  const cell = P.solution[a];\n  const occ = st.placed.indexOf(cell);\n  if(occ >= 0 && occ !== a) st.placed[occ] = -1;\n  st.placed[a] = cell;\n  const mi = st.marks.indexOf(cell); if(mi >= 0) st.marks.splice(mi, 1);\n  if(st.locked.indexOf(a) \u003c 0) st.locked.push(a);\n  st.hints++;\n  if(sel === a) sel = -1;\n  afterMove();\n  if(!done) setMsg(P.actors[a].name + ' belongs in ' + P.movies[P.own[cell]].t + '.', true);\n}\nfunction clearBoard(){\n  if(done) return;\n  st.placed = st.placed.map((c, a) => st.locked.indexOf(a) >= 0 ? c : -1);\n  st.marks = []; sel = -1;\n  afterMove();\n}\n\n/* ---------- Progress / results ---------- */\nconst freshState = () => ({ placed:[-1,-1,-1,-1,-1], marks:[], hints:0, locked:[], elapsed:0 });\nfunction saveProgress(){\n  if(replay || store.results[iso]) return;\n  store.progress[iso] = st; saveStore();\n}\nfunction recordWin(){\n  if(store.results[iso]) return;\n  if(isToday){\n    const y = toISO(new Date(parseISO(iso) - MS_DAY));\n    store.streak = (store.lastPlayedISO === y && store.streak > 0) ? store.streak + 1 : 1;\n    store.best = Math.max(store.best, store.streak);\n    store.lastPlayedISO = iso;\n  }\n  store.solved++;\n  store.results[iso] = { t: st.elapsed, h: st.hints, archive: !isToday };\n  delete store.progress[iso];\n  saveStore();\n}\n\nfunction startTimer(){\n  clearInterval(timerId);\n  $('#timer').textContent = fmtTime(st.elapsed);\n  timerId = setInterval(() => {\n    if(document.hidden) return;\n    st.elapsed++;\n    $('#timer').textContent = fmtTime(st.elapsed);\n    if(st.elapsed % 5 === 0) saveProgress();\n  }, 1000);\n}\n\nfunction win(){\n  done = true; sel = -1;\n  clearInterval(timerId);\n  if(!replay) recordWin();\n  setMsg('');\n  paint();\n  renderSolution();\n  scrollToEl($('#game'), $('#solutionSlot'));\n}\n\nfunction renderSolution(){\n  const res = store.results[iso];\n  const time = replay ? st.elapsed : res.t, hints = replay ? st.hints : res.h;\n  const castHtml = P.actors.map((a, i) => {\n    const k = P.own[P.solution[i]], m = P.movies[k];\n    const also = a.films.filter(f => f !== k).map(f => P.movies[f].t);\n    return '\u003cli>\u003cspan class=\"sw c' + k + '\">\u003c/span>\u003cspan>\u003cb>' + esc(a.name) + '\u003c/b> \\u2014 ' + esc(m.t) +\n      ' (' + m.y + ', ' + esc(m.s) + ')' + (also.length ? '\u003cem>Also in today\\u2019s line-up: ' + esc(also.join(', ')) + '\u003c/em>' : '') +\n      '\u003c/span>\u003c/li>';\n  }).join('');\n  const banner = replay ? 'Replay \\u00B7 your original result is kept'\n    : isToday ? '\\u{1F525} Streak: ' + displayStreak() + (displayStreak() === 1 ? ' day' : ' days') + ' \\u00B7 Solved ' + store.solved\n    : '\\u{1F5C3} Archive puzzle \\u00B7 streak untouched \\u00B7 Solved ' + store.solved;\n  $('#solutionSlot').innerHTML =\n    '\u003csection class=\"solution\">' +\n      '\u003cp class=\"verdict-line\">That\\u2019s a wrap!\u003c/p>' +\n      '\u003cp class=\"sub\">Solved in ' + fmtTime(time) + ' \\u00B7 ' + (hints ? hints + (hints === 1 ? ' hint' : ' hints') : 'no hints') + '\u003c/p>' +\n      '\u003ch4>Today\\u2019s cast\u003c/h4>\u003cul class=\"cast\">' + castHtml + '\u003c/ul>' +\n      '\u003cdiv class=\"streak-banner\">' + banner + '\u003c/div>' +\n      '\u003cdiv class=\"actions\">' +\n        '\u003cbutton id=\"shareBtn\" class=\"btn\" type=\"button\">Share result\u003c/button>' +\n        '\u003cbutton id=\"againBtn\" class=\"btn\" type=\"button\">Play again\u003c/button>' +\n        '\u003cbutton id=\"archiveBtn\" class=\"btn\" type=\"button\">Previous days\u003c/button>' +\n        '\u003cbutton id=\"homeBtn\" class=\"btn primary\" type=\"button\">Back home\u003c/button>' +\n      '\u003c/div>' +\n      (isToday ? '\u003cp class=\"next-in\">Next puzzle in \u003cspan id=\"countdown\">--:--:--\u003c/span>\u003c/p>'\n               : '\u003cp class=\"next-in\">Day ' + String(dayN).padStart(3,'0') + ' complete\u003c/p>') +\n    '\u003c/section>';\n  $('#shareBtn').addEventListener('click', share);\n  $('#againBtn').addEventListener('click', playAgain);\n  $('#archiveBtn').addEventListener('click', () => openArchive('game'));\n  $('#homeBtn').addEventListener('click', goHome);\n  if(isToday) startCountdown();\n}\n\nfunction playAgain(){\n  replay = true; done = false; sel = -1;\n  st = freshState();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('Replay \\u2014 this won\\u2019t change your stats.', true);\n  paint(); startTimer();\n  pinToTop($('#game'));\n}\n\n/* ---------- Share (secure-context aware, with fallbacks) ---------- */\nfunction resultText(day, puzzle, res){\n  let grid = '';\n  for(let r = 0; r \u003c N; r++){ for(let c = 0; c \u003c N; c++) grid += EMOJI[puzzle.own[r * N + c]]; grid += '\\n'; }\n  return 'Blockbuster #' + day + '\\n\\u{1F3AC} Solved in ' + fmtTime(res.t) + ' \\u00B7 ' +\n    (res.h ? res.h + ' hint' + (res.h > 1 ? 's' : '') : 'no hints') + '\\n' + grid.trim();\n}\nfunction sendShare(text, btnId, label){\n  var isWeb = /^https?:$/.test(UMG_HOST.protocol);\n  var payload = isWeb ? text + '\\n' + UMG_HOST.url : text;\n  function legacyCopy(){\n    try{\n      var ta = document.createElement('textarea');\n      ta.value = payload; ta.setAttribute('readonly','');\n      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';\n      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, payload.length);\n      var ok = document.execCommand('copy'); document.body.removeChild(ta);\n      if(ok){ flash(btnId, label); return; }\n    }catch(e){}\n    window.prompt('Copy and share:', payload);\n  }\n  function clip(){\n    if(navigator.clipboard && window.isSecureContext){\n      navigator.clipboard.writeText(payload).then(function(){ flash(btnId, label); }, legacyCopy);\n    }else legacyCopy();\n  }\n  if(navigator.share && isWeb){\n    navigator.share({ title:'Blockbuster', text:text, url:UMG_HOST.url }).catch(function(err){ if(!err || err.name !== 'AbortError') clip(); });\n    return;\n  }\n  clip();\n}\nfunction share(){\n  const res = store.results[iso]; if(!res) return;\n  sendShare(resultText(dayN, P, res), '#shareBtn', 'Share result');\n}\n/* Landing page: shares today's result if solved, otherwise an invite to play */\nfunction shareLanding(){\n  const res = store.results[todayISO];\n  const streak = displayStreak();\n  const text = res\n    ? resultText(todayDay, puzzleForDay(todayDay), res) + (streak ? '\\n\\u{1F525} Streak: ' + streak : '')\n    : '\\u{1F3AC} Blockbuster #' + todayDay + '\\nFive movies. Five actors. Can you put every star in their place?' +\n      (streak ? '\\n\\u{1F525} My streak: ' + streak : '');\n  sendShare(text, '#landingShareBtn', 'Share');\n}\nfunction flash(btnId, label){\n  const b = $(btnId); if(!b) return;\n  b.textContent = 'Copied!';\n  setTimeout(() => { const s = $(btnId); if(s) s.textContent = label; }, 2500);\n}\n\nfunction startCountdown(){\n  clearInterval(countdownId);\n  const tick = () => {\n    const now = new Date();\n    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime();\n    const d = Math.max(0, next - now.getTime());\n    const el = $('#countdown');\n    if(el) el.textContent = [Math.floor(d / 3600000), Math.floor(d % 3600000 / 60000), Math.floor(d % 60000 / 1000)]\n      .map(n => String(n).padStart(2,'0')).join(':');\n  };\n  tick(); countdownId = setInterval(tick, 1000);\n}\n\n/* ---------- Screens ---------- */\nfunction show(id){\n  document.body.classList.toggle('on-landing', id === 'landing');   // footer only on the landing page\n  ['landing','game','archive'].forEach(s => {\n    const el = document.getElementById(s);\n    if(s === id){ el.classList.remove('hidden-left','hidden-right'); }\n    else if(!el.classList.contains('hidden-left') && !el.classList.contains('hidden-right')){\n      el.classList.add(s === 'landing' ? 'hidden-left' : 'hidden-right');\n    }\n  });\n  pinToTop(document.getElementById(id));\n}\n\nfunction openDay(n){\n  if(ptr) endGesture();\n  clearInterval(countdownId); clearInterval(timerId);\n  dayN = n; iso = isoForDay(n); isToday = (n === todayDay);\n  P = puzzleForDay(n);\n  ini = initialsFor(P.actors.map(a => a.name));\n  sel = -1; replay = false;\n  $('#dayNo').textContent = 'Day ' + String(n).padStart(3,'0') + ' \\u00B7 ' +\n    dateForDay(n).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });\n  const flag = $('#archiveFlag');\n  flag.classList.toggle('on', !isToday);\n  flag.textContent = isToday ? '' : '\\u{1F5C3} From the archive \\u00B7 ' + longDate(dateForDay(n)) + ' \\u00B7 does not affect your streak';\n  buildBoard();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('');\n  const res = store.results[iso];\n  if(res){\n    done = true;\n    st = freshState(); st.placed = P.solution.slice(); st.elapsed = res.t; st.hints = res.h;\n    $('#timer').textContent = fmtTime(res.t);\n    paint(); renderSolution();\n  }else{\n    done = false;\n    const saved = store.progress[iso];\n    st = saved ? Object.assign(freshState(), saved) : freshState();\n    paint(); startTimer();\n  }\n  show('game');\n  setTimeout(() => softFocus(document.querySelector('.actor:not(:disabled)')), 500);\n}\n\n/* Archive cards appear instantly; each day's line-up is filled in one at a time\n   (and remembered) so slow devices such as smart TVs never freeze. */\nconst ARC_KEY = 'umg.blockbuster.lineups.' + MOVIES.length;\nlet arcCache = (() => { try{ return JSON.parse(localStorage.getItem(ARC_KEY)) || {}; }catch(e){ return {}; } })();\nlet arcGen = 0, arcSaveId = null;\nfunction lineupFor(n){\n  if(!arcCache[n]){\n    arcCache[n] = puzzleForDay(n).movies.map(m => m.t);\n    clearTimeout(arcSaveId);\n    arcSaveId = setTimeout(() => { try{ localStorage.setItem(ARC_KEY, JSON.stringify(arcCache)); }catch(e){} }, 400);\n  }\n  return arcCache[n];\n}\nfunction fillCard(n){\n  const el = document.querySelector('.day-card[data-day=\"' + n + '\"] .dc-films');\n  if(!el || el.dataset.done) return;\n  el.textContent = lineupFor(n).join(' \\u00B7 ');\n  el.dataset.done = '1';\n}\nfunction buildArchive(){\n  const gen = ++arcGen;\n  const cards = []; let solved = 0, prog = 0, open = 0;\n  for(let n = todayDay; n >= 1; n--){\n    const d = isoForDay(n), res = store.results[d], pr = store.progress[d];\n    const isT = n === todayDay;\n    let cls, label;\n    if(res){ solved++; cls = 'solved'; label = 'Solved \\u00B7 ' + fmtTime(res.t); }\n    else if(pr){ prog++; cls = 'progress'; label = isT ? 'Today \\u00B7 in progress' : 'In progress'; }\n    else if(isT){ open++; cls = 'today'; label = 'Today\\u2019s puzzle'; }\n    else{ open++; cls = 'unplayed'; label = 'Unplayed \\u00B7 play now'; }\n    const known = arcCache[n];\n    cards.push('\u003cbutton class=\"day-card' + (isT ? ' is-today' : '') + '\" type=\"button\" data-day=\"' + n + '\">' +\n      '\u003cspan class=\"dc-no\">Day ' + String(n).padStart(3,'0') + ' \\u00B7 ' +\n        esc(dateForDay(n).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' })) + '\u003c/span>' +\n      '\u003cspan class=\"dc-sw\">' + [0,1,2,3,4].map(k => '\u003cspan class=\"c' + k + '\">\u003c/span>').join('') + '\u003c/span>' +\n      '\u003cspan class=\"dc-films\"' + (known ? ' data-done=\"1\">' + esc(known.join(' \\u00B7 ')) : '>Loading line-up\\u2026') + '\u003c/span>' +\n      '\u003cspan class=\"dc-status ' + cls + '\">' + label + '\u003c/span>\u003c/button>');\n  }\n  $('#archiveGrid').innerHTML = cards.join('');\n  $('#arcSolved').textContent = solved; $('#arcProgress').textContent = prog; $('#arcOpen').textContent = open;\n  document.querySelectorAll('.day-card').forEach(b => b.addEventListener('click', () => { arcGen++; openDay(Number(b.dataset.day)); }));\n  let next = todayDay;\n  const step = () => {\n    if(gen !== arcGen || $('#archive').classList.contains('hidden-right')) return;\n    while(next >= 1 && arcCache[next]){ fillCard(next); next--; }\n    if(next \u003c 1) return;\n    fillCard(next); next--;\n    setTimeout(step, 30);\n  };\n  setTimeout(step, 120);\n}\nfunction openArchive(){\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  buildArchive(); show('archive');\n  setTimeout(() => softFocus(document.querySelector('.day-card')), 500);\n}\nfunction goHome(){\n  arcGen++;\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  paintLanding(); show('landing');\n  setTimeout(() => softFocus($('#startBtn')), 450);\n}\n\n/* ---------- Background video: keep it running, hide on failure ---------- */\nconst bgv = $('#bgVideo');\nfunction kickVideo(){\n  if(!bgv || bgv.classList.contains('failed')) return;\n  bgv.muted = true;\n  if(bgv.paused){ const p = bgv.play(); if(p && p.catch) p.catch(() => {}); }\n}\nbgv.addEventListener('error', () => bgv.classList.add('failed'), true);\n['loadedmetadata','canplay','stalled','pause'].forEach(e => bgv.addEventListener(e, kickVideo));\ndocument.addEventListener('visibilitychange', () => { if(!document.hidden) kickVideo(); });\n['pointerdown','touchstart','keydown'].forEach(e => window.addEventListener(e, kickVideo, { passive:true }));\nkickVideo();\n\n/* ---------- Keyboard / TV remote ---------- */\ndocument.addEventListener('keydown', e => {\n  const gameOn = !$('#game').classList.contains('hidden-right') && !$('#game').classList.contains('hidden-left');\n  const ae = document.activeElement;\n  if(gameOn && !done){\n    if(/^[1-5]$/.test(e.key)){ selectActor(Number(e.key) - 1); return; }\n    if(e.key === 'Escape'){ sel = -1; setMsg(''); paint(); return; }\n    if((e.key === 'Backspace' || e.key === 'Delete') && ae && ae.dataset && ae.dataset.cell){\n      const c = Number(ae.dataset.cell), occ = st.placed.indexOf(c);\n      if(occ >= 0 && st.locked.indexOf(occ) \u003c 0){ st.placed[occ] = -1; afterMove(); }\n      e.preventDefault(); return;\n    }\n  }\n  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) === -1) return;\n  // 2D movement inside the grid\n  if(ae && ae.dataset && ae.dataset.cell !== undefined){\n    const c = Number(ae.dataset.cell), r = c / N | 0, col = c % N;\n    let nr = r, nc = col;\n    if(e.key === 'ArrowUp') nr--; if(e.key === 'ArrowDown') nr++;\n    if(e.key === 'ArrowLeft') nc--; if(e.key === 'ArrowRight') nc++;\n    if(nr >= 0 && nr \u003c N && nc >= 0 && nc \u003c N){\n      e.preventDefault();\n      const t = document.querySelector('.cell[data-cell=\"' + (nr * N + nc) + '\"]');\n      try{ t.focus({ preventScroll:true }); }catch(err){ t.focus(); }\n      if(t.scrollIntoView) t.scrollIntoView({ block:'nearest', behavior:'smooth' });\n      return;\n    }\n  }\n  const list = [].slice.call(document.querySelectorAll(\n    '.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'));\n  if(!list.length) return;\n  e.preventDefault();\n  const i = list.indexOf(ae);\n  const fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';\n  const next = i === -1 ? list[0] : list[(i + (fwd ? 1 : -1) + list.length) % list.length];\n  try{ next.focus({ preventScroll:true }); }catch(err){ next.focus(); }\n  if(next.scrollIntoView) next.scrollIntoView({ block:'nearest', behavior:'smooth' });\n});\n\n/* Save the clock if the tab is closed or backgrounded mid-puzzle */\ndocument.addEv ;font-size:clamp(20px,2.6vw,28px);font-weight:800;line-height:1.15;margin:0}\n  .movie-meta{color:var(--muted);font-size:15px;font-size:clamp(13px,1.6vw,15px);margin:4px 0 0}\n\n  /* Board: real crossword look - white tiles, empty space transparent */\n  .board-wrap{width:var(--bs);height:var(--bs);display:grid;place-items:center}\n  .board{--cs:calc(var(--bs) / (var(--maxd) + .6));display:grid;\n    grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);\n    width:calc(var(--cs) * (var(--cols) + .6));height:calc(var(--cs) * (var(--rows) + .6));\n    gap:calc(var(--cs) * .07);padding:calc(var(--cs) * .3);border-radius:18px;\n    background:rgba(20,10,48,.55);border:1px solid var(--line);\n    box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 4px rgba(255,200,61,.35);\n    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n  .blank{min-width:0;min-height:0}\n  .cell{position:relative;border:0;padding:0;margin:0;min-width:0;min-height:0;cursor:pointer;touch-action:none;\n    border-radius:calc(var(--cs) * .16);background:#fbf8f3;color:#2a1300;display:grid;place-items:center;\n    font-weight:800;font-size:calc(var(--cs) * .5);line-height:1;transition:background .15s,box-shadow .15s}\n  .cell .num{position:absolute;top:calc(var(--cs) * .05);left:calc(var(--cs) * .08);font-size:calc(var(--cs) * .24);\n    font-weight:700;color:#7a6aa8;line-height:1}\n  .cell .ch{animation:pop .2s ease-out}\n  .cell.filled{background:#ffe7a8}\n  .cell.hint{background:var(--gold)}\n  .cell.fits{box-shadow:inset 0 0 0 3px var(--cyan)}\n  .cell.bad{background:#ff9d9d;color:#5a0000}\n  .cell.drop-target{background:#ffd1e6;box-shadow:inset 0 0 0 3px var(--pink)}\n  .cell.drop-bad{box-shadow:inset 0 0 0 3px var(--red)}\n  .cell.lifted .ch{opacity:.25}\n  .cell.win{background:#bff5d9}\n  .cell:focus-visible{outline:3px solid var(--pink);outline-offset:-3px}\n  .kbd .cell:focus{outline:3px solid var(--pink);outline-offset:-3px}\n  .cell:disabled{cursor:default}\n  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}\n\n  /* Cast tray */\n  .tray{display:grid;grid-template-columns:1fr;gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n  .star{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 12px;min-height:54px;\n    border:2px solid var(--line);border-radius:14px;background:rgba(30,16,70,.85);color:#fff;cursor:grab;touch-action:none;\n    transition:transform .15s,border-color .15s,background .15s,opacity .15s}\n  .star:hover:not(:disabled){border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .star:focus-visible{border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .star:focus{border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .star.sel{border-color:var(--gold);background:rgba(255,200,61,.22);box-shadow:0 0 0 2px var(--gold) inset}\n  .star.placed{opacity:.55}\n  .star.bad{border-color:var(--red)}\n  .star.dragging{opacity:.3}\n  .star:disabled{cursor:default}\n  .len{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--bg2);border:2px solid var(--gold);\n    display:grid;place-items:center;font-weight:800;font-size:14px}\n  .star.sel .len{background:var(--gold);color:#2a1300}\n  .who{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}\n  .nm{font-weight:700;font-size:16.5px;font-size:clamp(14px,1.7vw,16.5px);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .wd{font-size:11.5px;letter-spacing:.18em;color:var(--cyan);font-weight:800}\n  .tick{flex:0 0 auto;color:var(--green);font-weight:800;display:none}\n  .star.placed .tick{display:block}\n  .key{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:700}\n  .tip{color:var(--muted);font-size:14.5px;font-size:clamp(12.5px,1.55vw,14.5px);line-height:1.45;margin:0;text-align:center}\n  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n  .msg{min-height:1.4em;text-align:center;font-weight:700;font-size:16px;font-size:clamp(13.5px,1.7vw,16px);color:#ffb3ad;margin:0}\n  .msg.good{color:#9ff5cb}\n\n  .drag-ghost{position:fixed;left:0;top:0;z-index:10000;pointer-events:none;padding:8px 14px;border-radius:999px;\n    background:var(--bg2);color:#fff;border:3px solid var(--gold);font-weight:800;letter-spacing:.12em;\n    font-size:18px;\n    font-size:clamp(14px,3.4vw,18px);box-shadow:0 12px 30px rgba(0,0,0,.5);white-space:nowrap;will-change:transform}\n  body.is-dragging,body.is-dragging *{cursor:grabbing!important}\n\n  /* ---------- Solution ---------- */\n  .solution{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;padding:clamp(20px,3vw,32px);animation:cardIn .5s forwards}\n  @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}\n  .verdict-line{font-size:56px;font-size:clamp(28px,4.6vw,56px);font-weight:900;margin:0 0 6px;line-height:1.1;\n    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .sub{font-size:22px;font-size:clamp(16px,2.1vw,22px);margin:0 0 18px;color:var(--gold);font-weight:800}\n  .solution h4{margin:18px 0 10px;font-size:13px;font-size:clamp(11px,1.5vw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}\n  .cast{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}\n  .cast li{font-size:17px;font-size:clamp(14px,1.8vw,17px);line-height:1.4;color:#f1edff}\n  .cast b{color:var(--cyan);margin-right:6px}\n  .streak-banner{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 0;padding:16px;border-radius:14px;\n    background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);font-weight:800;font-size:20px;font-size:clamp(15px,2vw,20px);flex-wrap:wrap;text-align:center}\n  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;gap:clamp(14px,2.4vw,24px);margin-top:24px}\n  .next-in{text-align:center;color:var(--muted);margin-top:22px;letter-spacing:.16em;text-transform:uppercase;\n    font-size:13px;\n    font-size:clamp(10.5px,1.4vw,13px);font-variant-numeric:tabular-nums}\n  .confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:50;pointer-events:none;animation:fall linear forwards}\n  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}\n\n  /* ---------- Archive ---------- */\n  #archive{align-items:flex-start}\n  .archive-wrap{width:100%;max-width:1180px;width:min(1180px,100%);margin:auto;display:flex;flex-direction:column;gap:22px;gap:clamp(14px,2.2vh,22px)}\n  .archive-head{text-align:center}\n  .archive-head h2{font-size:46px;font-size:clamp(26px,4vw,46px);margin:0 0 8px;font-weight:800;text-transform:uppercase}\n  .archive-head p{color:var(--muted);margin:0;font-size:16px;font-size:clamp(13px,1.7vw,16px)}\n  .archive-stats{display:flex;justify-content:center;gap:34px;gap:clamp(14px,3vw,34px);flex-wrap:wrap;padding:14px 0;\n    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n  .archive-stats div{text-align:center}\n  .archive-stats b{display:block;color:var(--gold);font-size:30px;font-size:clamp(20px,3vw,30px);line-height:1.2}\n  .archive-stats span{font-size:11.5px;font-size:clamp(9.5px,1.3vw,11.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n  .archive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}\n  .day-card{position:relative;text-align:left;padding:16px 16px 50px;border:2px solid var(--line);border-radius:16px;\n    background:rgba(30,16,70,.85);color:#fff;cursor:pointer;min-height:124px;transition:transform .18s,background .18s,border-color .18s}\n  .day-card:hover{transform:scale(1.02);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .day-card:focus-visible{transform:scale(1.02);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .day-card:focus{transform:scale(1.02);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .day-card.is-today{border-color:rgba(255,200,61,.7)}\n  .dc-no{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:800}\n  .dc-title{display:block;font-weight:800;font-size:20px;font-size:clamp(16px,1.9vw,20px);margin:8px 0 2px;line-height:1.2}\n  .dc-meta{display:block;color:var(--muted);font-size:13px}\n  .dc-status{position:absolute;left:16px;bottom:14px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding:5px 11px;border-radius:999px}\n  .dc-status.solved{background:rgba(31,157,94,.25);color:#9ff5cb;border:1px solid rgba(31,157,94,.6)}\n  .dc-status.progress{background:rgba(255,200,61,.18);color:#ffe7a8;border:1px solid rgba(255,200,61,.5)}\n  .dc-status.unplayed{background:rgba(255,255,255,.1);color:#e9e4ff;border:1px solid var(--line)}\n  .dc-status.today{background:var(--gold);color:#2a1300;border:1px solid #ffe39a}\n  .archive-foot{display:flex;justify-content:center;padding-bottom:26px;padding-bottom:clamp(14px,2.5vh,26px)}\n\n  /* ---------- Footer / loader ---------- */\n  #copyright{position:fixed;left:0;right:0;bottom:0;z-index:6;text-align:center;font-size:13px;font-size:clamp(10px,1.3vw,13px);\n    color:rgba(255,255,255,.7);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none;text-shadow:0 1px 4px #000}\n  #loader{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;align-content:center;gap:26px;background:var(--navy);z-index:9999;\n    transition:opacity .5s ease;padding:24px;text-align:center}\n  #loader.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}\n  .spinner{position:relative;width:160px;width:clamp(110px,18vw,160px);height:160px;height:clamp(110px,18vw,160px);display:grid;place-items:center}\n  .spinner .ring{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border:5px solid rgba(255,200,61,.18);border-top-color:var(--gold);border-right-color:var(--pink);animation:spin 1s linear infinite}\n  .spinner img{width:62%;height:62%;object-fit:contain;animation:pulse 1.6s ease-in-out infinite}\n  .loading-text{font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-size:14px;font-size:clamp(11px,1.5vw,14px)}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1);opacity:1}}\n\n  /* ---------- Responsive ---------- */\n  @media(min-width:960px){\n    :root{--bs:min(540px,64vh,52vw)}\n    .play{flex-direction:row;align-items:flex-start;justify-content:center;gap:28px}\n    .side{width:380px;width:min(380px,34vw)}\n  }\n  /* Phones / tablets: movie above the grid, cast straight below it */\n  @media(max-width:959px){\n    .play{gap:12px}\n    .side{display:contents}\n    .movie-panel{order:1;width:var(--bs);padding:10px 14px}\n    .movie-panel h3{margin:0 0 4px}\n    .play > .board-wrap{order:2}\n    .cast-panel{order:3;width:var(--bs);padding:10px 12px}\n    .cast-panel h3{margin:0 0 8px}\n    .tray{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}\n    .star{min-height:48px;padding:5px 8px;gap:7px}\n    .len{width:28px;height:28px;font-size:12px}\n    .nm{font-size:13px}\n    .wd{font-size:10px;letter-spacing:.12em}\n    .side > .msg{order:4;width:var(--bs)}\n    .side > .controls{order:5;width:var(--bs)}\n    .side > .tip{order:6;width:var(--bs)}\n  }\n  @media(max-width:760px){\n    #game .rules{display:none}          /* rules are on the landing page; keeps the cast on screen */\n    .rules,.how{grid-template-columns:repeat(2,minmax(0,1fr))}\n    .actions,.cast{grid-template-columns:1fr}\n    .screen{padding:18px 14px 52px}\n    .archive-grid{grid-template-columns:1fr}\n    .key{display:none}\n  }\n  @media(max-width:380px){ .controls{grid-template-columns:1fr 1fr} .controls .btn:last-child{grid-column:span 2} }\n  @media(min-width:1600px){\n    :root{--bs:min(760px,64vh)}\n    .screen{padding:5vh 7vw 7vh}\n    .btn{min-height:68px}\n    .side{width:520px;width:min(520px,30vw)}\n    .star{min-height:64px}\n    .len{width:42px;height:42px;font-size:16px}\n  }\n  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n\n  /* ---- embedded in the Daily Movie Games hub ---- */\n  html,body{background:transparent!important}\n  #bg,.spot,#bgOverlay,#bgVideo,#loader{display:none!important}\n\n  body:not(.on-landing) #copyright{display:none}\n  /* ---- Smart TVs: no share sheet / clipboard on TV browsers, lighter animation ---- */\n  .tv #landingShareBtn,.tv #shareBtn{display:none!important}\n  .tv .spot,.tv .confetti{animation:none!important}\n  .kbd button:focus{outline:4px solid var(--gold);outline-offset:4px}\n\n  /* ---- Phones on their side: grid and side panel next to each other ---- */\n  @media (orientation:landscape) and (max-height:600px) and (min-width:560px) and (max-width:959px){\n    :root{--bs:min(82vh,46vw)}\n    .play{flex-direction:row;align-items:flex-start;justify-content:center;gap:18px}\n    .side{display:flex;flex-direction:column;gap:10px;width:min(380px,46vw);order:3}\n    #game .rules{display:none}\n    .screen{padding:12px 16px 40px}\n  }\n\n  /* ---- room for the hub's music button in the top-right corner ---- */\n  .topbar,.top{padding-right:56px}\n  @media(min-width:1600px){ .topbar,.top{padding-right:76px} }\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"on-landing\">\n\u003cvideo id=\"bgVideo\" autoplay muted loop playsinline preload=\"auto\" disablepictureinpicture>\n\u003c/video>\n\u003cdiv id=\"bgOverlay\">\u003c/div>\n\u003cdiv id=\"bg\">\u003c/div>\n\u003cdiv class=\"spot a\">\u003c/div>\u003cdiv class=\"spot b\">\u003c/div>\n\n\u003cdiv id=\"loader\" role=\"status\" aria-live=\"polite\" aria-label=\"Loading\">\n  \u003cdiv class=\"spinner\">\u003cdiv class=\"ring\">\u003c/div>\u003cimg src=\"logo_white.png\" alt=\"\">\u003c/div>\n  \u003cdiv class=\"loading-text\">Rolling the credits&hellip;\u003c/div>\n\u003c/div>\n\n\u003c!-- ============ LANDING ============ -->\n\u003csection id=\"landing\" class=\"screen\">\n  \u003cmain class=\"landing-content\">\n    \u003cimg class=\"logo\" src=\"logo_white.png\" alt=\"Logo\">\n    \u003ch1 class=\"brand\">Star Crossed\u003cspan class=\"of\">the daily movie cast crossword\u003c/span>\u003c/h1>\n    \u003cdiv class=\"rule\">\u003c/div>\n    \u003cp class=\"datestamp\" id=\"landingDate\">\u003c/p>\n    \u003cp class=\"tagline\" id=\"landingTag\">One movie. Its biggest stars. Cross them all into the grid.\u003c/p>\n    \u003cdiv class=\"how\">\n      \u003cdiv class=\"chiprule\">Every name is a star of today&rsquo;s movie\u003c/div>\n      \u003cdiv class=\"chiprule\">Drag or tap a star into a space that fits\u003c/div>\n      \u003cdiv class=\"chiprule\">Crossing letters must match\u003c/div>\n      \u003cdiv class=\"chiprule\">Fill the whole grid to finish\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stats\">\n      \u003cdiv class=\"stat\">\u003cb id=\"statStreak\">0\u003c/b>\u003cspan>Streak\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statBest\">0\u003c/b>\u003cspan>Best\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statSolved\">0\u003c/b>\u003cspan>Solved\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"landing-actions\">\n      \u003cbutton id=\"startBtn\" class=\"btn primary btn-lg\" type=\"button\">Play today\u003c/button>\n      \u003cdiv class=\"landing-row\">\n        \u003cbutton id=\"landingArchiveBtn\" class=\"btn ghost\" type=\"button\">Previous days\u003c/button>\n        \u003cbutton id=\"landingShareBtn\" class=\"btn ghost\" type=\"button\">Share\u003c/button>\n        \u003cbutton id=\"hubBtn\" class=\"btn ghost\" type=\"button\">All games\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ GAME ============ -->\n\u003csection id=\"game\" class=\"screen hidden-right\">\n  \u003cmain class=\"wrap\">\n    \u003cimg class=\"small-logo\" src=\"logo_white.png\" alt=\"Logo\">\n    \u003cdiv class=\"archive-flag\" id=\"archiveFlag\">\u003c/div>\n    \u003cheader class=\"top\">\n      \u003cdiv>\n        \u003cdiv class=\"day-no\" id=\"dayNo\">\u003c/div>\n        \u003ch2 class=\"title\">Star Crossed\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"timer\" id=\"timer\">0:00\u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"rules\">\n      \u003cdiv class=\"chiprule\">Every name is a star of today&rsquo;s movie\u003c/div>\n      \u003cdiv class=\"chiprule\">Drag or tap a star into a space that fits\u003c/div>\n      \u003cdiv class=\"chiprule\">Crossing letters must match\u003c/div>\n      \u003cdiv class=\"chiprule\">Fill the whole grid to finish\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"play\">\n      \u003cdiv class=\"board-wrap\">\u003cdiv class=\"board\" id=\"board\" aria-label=\"Crossword grid\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"side\">\n        \u003csection class=\"panel movie-panel\">\u003ch3>Today&rsquo;s feature\u003c/h3>\n          \u003cp class=\"movie-name\" id=\"movieName\">\u003c/p>\u003cp class=\"movie-meta\" id=\"movieMeta\">\u003c/p>\u003c/section>\n        \u003csection class=\"panel cast-panel\">\u003ch3>Starring\u003c/h3>\u003cdiv class=\"tray\" id=\"tray\">\u003c/div>\u003c/section>\n        \u003cp class=\"msg\" id=\"msg\" aria-live=\"polite\">\u003c/p>\n        \u003cdiv class=\"controls\">\n          \u003cbutton id=\"hintBtn\" class=\"btn sm\" type=\"button\">Hint\u003c/button>\n          \u003cbutton id=\"resetBtn\" class=\"btn sm\" type=\"button\">Clear\u003c/button>\n          \u003cbutton id=\"gameHomeBtn\" class=\"btn sm\" type=\"button\">Home\u003c/button>\n        \u003c/div>\n        \u003cp class=\"tip\">Drag a star onto the grid, or tap a star then tap a square. Blue outlines show spaces that fit. Drag a placed name to move it, or off the grid to remove it.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"solutionSlot\">\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ ARCHIVE ============ -->\n\u003csection id=\"archive\" class=\"screen hidden-right\">\n  \u003cmain class=\"archive-wrap\">\n    \u003cimg class=\"small-logo\" src=\"logo_white.png\" alt=\"Logo\">\n    \u003cdiv class=\"archive-head\">\n      \u003ch2>Previous Days\u003c/h2>\n      \u003cp>Every feature since day one. Catch up on the ones you missed.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"archive-stats\">\n      \u003cdiv>\u003cb id=\"arcSolved\">0\u003c/b>\u003cspan>Solved\u003c/span>\u003c/div>\n      \u003cdiv>\u003cb id=\"arcProgress\">0\u003c/b>\u003cspan>In progress\u003c/span>\u003c/div>\n      \u003cdiv>\u003cb id=\"arcOpen\">0\u003c/b>\u003cspan>Unplayed\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"archive-grid\" id=\"archiveGrid\">\u003c/div>\n    \u003cdiv class=\"archive-foot\">\u003cbutton id=\"arcHomeBtn\" class=\"btn\" type=\"button\">Back home\u003c/button>\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003cfooter id=\"copyright\">&copy; \u003cspan id=\"year\">\u003c/span> NBCUniversal &middot; A new feature every day\u003c/footer>\n\n\u003cscript>\n/* ---------- Compatibility: older smart-TV browsers (Chrome 53+) ---------- */\nif(!String.prototype.padStart){\n  String.prototype.padStart = function(n, s){\n    var t = String(this); if(t.length >= n) return t;\n    s = s === undefined ? ' ' : String(s); if(!s) return t;\n    var p = ''; while(p.length \u003c n - t.length) p += s;\n    return p.slice(0, n - t.length) + t;\n  };\n}\nif(window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;\n/* ======================================================================\n   STAR CROSSED - fully self-contained daily movie cast crossword.\n   Each day picks one movie and builds a crossword from its stars'\n   surnames with a seeded generator, so everyone gets the same grid.\n   Any filling where every space is used and every crossing letter\n   matches counts as solved.\n   NOTE: editing the MOVIES list changes which movie falls on each day,\n   including past days.\n   ====================================================================== */\nconst START_DATE = '2026-10-01';      // day 1\nconst STORE_KEY  = 'umg.starcrossed.v1';\nconst UMG_HOST = /*UMG_HOST*/null || { protocol: location.protocol, url: location.href };\nconst IS_TV = !!UMG_HOST.tv || /SMART-TV|SmartTV|Tizen|Web0S|webOS|WebOS|NetCast|LG Browser|HbbTV|BRAVIA|Sony|CrKey|GoogleTV|Google TV|Android TV|AndroidTV|AFT[A-Z]|Roku|VIDAA|Viera|Panasonic|AQUOS|Sharp|PhilipsTV|Philips|TPV|Hisense|Vizio|Opera TV|OMI|Vewd|Titan|Freeview|\\bTV\\b/i.test(navigator.userAgent);\n/* ---------- Input mode: show focus rings for remotes/keyboards, hide them for touch/mouse ---------- */\n(function(){\n  var root = document.documentElement;\n  if(IS_TV) root.classList.add('tv', 'kbd');\n  document.addEventListener('keydown', function(e){\n    if(/^(Arrow|Enter|Tab|Up|Down|Left|Right)/.test(e.key || '') || (e.keyCode >= 37 && e.keyCode \u003c= 40) || e.keyCode === 13) root.classList.add('kbd');\n  }, true);\n  document.addEventListener('pointerdown', function(e){ if(!IS_TV && e.pointerType) root.classList.remove('kbd'); }, true);\n})();\n\n/* Back button on every remote: Samsung Tizen (10009), LG webOS (461), Android/Fire TV, keyboards */\nvar BACK_KEYS = ['Escape','BrowserBack','GoBack','Back','XF86Back','Backspace'];\nvar BACK_CODES = [10009, 461, 166, 27, 8];\nfunction isBackKey(e){ return BACK_KEYS.indexOf(e.key) !== -1 || BACK_CODES.indexOf(e.keyCode) !== -1; }\n/* ---------- TV remotes: some TV browsers send old key names / codes; normalise them ---------- */\nvar KEY_ALIAS = { Left:'ArrowLeft', Up:'ArrowUp', Right:'ArrowRight', Down:'ArrowDown' };\nvar KEY_CODES = { 37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown', 13:'Enter' };\nfunction normKey(e){\n  var k = e.key;\n  if(KEY_ALIAS[k]) return KEY_ALIAS[k];\n  if((!k || k === 'Unidentified') && KEY_CODES[e.keyCode]) return KEY_CODES[e.keyCode];\n  return null;\n}\nfunction synthKey(target, k, code){\n  var ev;\n  try{ ev = new KeyboardEvent('keydown', { key:k, bubbles:true, cancelable:true }); }\n  catch(x){ ev = document.createEvent('Event'); ev.initEvent('keydown', true, true); try{ Object.defineProperty(ev, 'key', { get:function(){ return k; } }); }catch(y){} }\n  try{ Object.defineProperty(ev, 'keyCode', { get:function(){ return code || 0; } }); }catch(x){}\n  ev.umgSynthetic = true;\n  (target || document.body).dispatchEvent(ev);\n}\n\nfunction firstButton(){\n  var l = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'))\n    .filter(function(b){ return b.offsetParent !== null; });\n  return l[0] || null;\n}\nfunction fireKey(k, code){\n  document.documentElement.classList.add('kbd');\n  var t = document.activeElement;\n  if(!t || t === document.body || t === document.documentElement){\n    var f = firstButton();\n    if(f){ try{ f.focus({ preventScroll:true }); }catch(x){ f.focus(); } if(/^Arrow/.test(k)) return; t = f; }\n  }\n  if(k === 'Enter'){ if(t && t.tagName === 'BUTTON' && !t.disabled) t.click(); return; }\n  synthKey(t, k, code);\n}\nwindow.addEventListener('keydown', function(e){\n  if(e.umgSynthetic) return;\n  if(e.key === 'm' || e.key === 'M'){ try{ parent.postMessage({ umg:'music' }, '*'); }catch(x){} return; }\n  var k = normKey(e); if(!k) return;\n  e.preventDefault(); e.stopImmediatePropagation();\n  fireKey(k, e.keyCode);\n}, true);\n/* Keys pressed while the TV gave focus to the hub page are forwarded here */\nwindow.addEventListener('message', function(e){\n  var d = e.data || {}; if(d.umg !== 'key') return;\n  var k = KEY_ALIAS[d.key] || d.key;\n  if((!k || k === 'Unidentified') && KEY_CODES[d.code]) k = KEY_CODES[d.code];\n  if(k) fireKey(k, d.code);\n});\n/* Let the hub know about taps/presses here so it can start the video and music (browsers need a gesture) */\n(function(){\n  var last = 0;\n  function g(){ var n = Date.now(); if(n - last \u003c 800) return; last = n; try{ parent.postMessage({ umg:'gesture' }, '*'); }catch(x){} }\n  ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, g, { capture:true, passive:true }); });\n})();\n\n\n\n/* ==PURE-START== */\n/* [title, year, studio, [cast in billing order]]  - \"Name|WORD\" overrides the word used in the grid.\n   Please verify before launch. */\nconst MOVIES = /*MOVIES_DATA*/null;\n\nconst MAXD = 11;     // max grid width/height (keeps cells usable on phones)\nconst MAXW = 8;      // max names per puzzle\n\nfunction mulberry(a){\n  return function(){\n    a |= 0; a = a + 0x6D2B79F5 | 0;\n    let t = Math.imul(a ^ a >>> 15, 1 | a);\n    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n    return ((t ^ t >>> 14) >>> 0) / 4294967296;\n  };\n}\nfunction shuffle(arr, r){\n  for(let i = arr.length - 1; i > 0; i--){ const j = r() * (i + 1) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }\n  return arr;\n}\nfunction wordFor(n){\n  const p = n.split('|');\n  if(p[1]) return p[1];\n  const t = p[0].split(/\\s+/).filter(x => !/^(Jr\\.?|Sr\\.?|II|III)$/.test(x));\n  return t[t.length - 1].normalize('NFD').replace(/[^A-Za-z]/g, '').toUpperCase();\n}\nconst K = (r, c) => r + ',' + c;\nfunction canPlace(g, w, r0, c0, dir){\n  const dr = dir ? 1 : 0, dc = dir ? 0 : 1, L = w.length;\n  if(g.has(K(r0 - dr, c0 - dc)) || g.has(K(r0 + L * dr, c0 + L * dc))) return -1;\n  let x = 0;\n  for(let i = 0; i \u003c L; i++){\n    const r = r0 + i * dr, c = c0 + i * dc, cell = g.get(K(r, c));\n    if(cell){\n      if(cell.ch !== w[i] || (dir ? cell.v : cell.h)) return -1;\n      x++;\n    }else if(g.has(K(r + dc, c + dr)) || g.has(K(r - dc, c - dr))) return -1;\n  }\n  return x;\n}\nfunction put(g, w, r0, c0, dir){\n  for(let i = 0; i \u003c w.length; i++){\n    const k = K(r0 + (dir ? i : 0), c0 + (dir ? 0 : i));\n    const cell = g.get(k) || { ch:w[i], h:false, v:false };\n    if(dir) cell.v = true; else cell.h = true;\n    g.set(k, cell);\n  }\n}\nfunction layout(pool, r){\n  let best = null;\n  for(let t = 0; t \u003c 140; t++){\n    const keys = pool.map((p, i) => ({ i, k:p.w.length + r() * 6 }));\n    keys.sort((a, b) => b.k - a.k);\n    const g = new Map(), placed = [];\n    let minR = 0, maxR = 0, minC = 0, maxC = 0, cross = 0;\n    for(const { i } of keys){\n      if(placed.length >= MAXW) break;\n      const w = pool[i].w;\n      if(!placed.length){\n        const dir = r() \u003c .5 ? 0 : 1;\n        put(g, w, 0, 0, dir); placed.push({ i, r:0, c:0, dir });\n        maxR = dir ? w.length - 1 : 0; maxC = dir ? 0 : w.length - 1;\n        continue;\n      }\n      let bp = null;\n      for(const p of placed){\n        const pw = pool[p.i].w;\n        for(let a = 0; a \u003c pw.length; a++) for(let b = 0; b \u003c w.length; b++){\n          if(pw[a] !== w[b]) continue;\n          const dir = p.dir ? 0 : 1;\n          const r0 = p.dir ? p.r + a : p.r - b;\n          const c0 = p.dir ? p.c - b : p.c + a;\n          const x = canPlace(g, w, r0, c0, dir);\n          if(x \u003c 1) continue;\n          const nr0 = Math.min(minR, r0), nc0 = Math.min(minC, c0);\n          const nr1 = Math.max(maxR, r0 + (dir ? w.length - 1 : 0)), nc1 = Math.max(maxC, c0 + (dir ? 0 : w.length - 1));\n          const H = nr1 - nr0 + 1, W = nc1 - nc0 + 1;\n          if(H > MAXD || W > MAXD) continue;\n          const sc = x * 6 - H * W * .15 - Math.abs(H - W) * .8 + r() * 3;\n          if(!bp || sc > bp.sc) bp = { sc, r0, c0, dir, x, nr0, nc0, nr1, nc1 };\n        }\n      }\n      if(bp){\n        put(g, w, bp.r0, bp.c0, bp.dir);\n        placed.push({ i, r:bp.r0, c:bp.c0, dir:bp.dir });\n        cross += bp.x; minR = bp.nr0; minC = bp.nc0; maxR = bp.nr1; maxC = bp.nc1;\n      }\n    }\n    const H = maxR - minR + 1, W = maxC - minC + 1;\n    const score = placed.length * 1000 + cross * 15 - H * W * 1.5 - Math.abs(H - W) * 6;\n    if(!best || score > best.score)\n      best = { score, rows:H, cols:W, placed:placed.map(p => ({ i:p.i, r:p.r - minR, c:p.c - minC, dir:p.dir })) };\n  }\n  return best;\n}\n/* Only movies with enough usable surnames go into the daily rotation */\nconst SC_LIST = MOVIES.map((m, i) => i).filter(i => {\n  const seen = {}; let n = 0;\n  MOVIES[i][3].forEach(x => { const w = wordFor(x); if(w.length >= 3 && w.length \u003c= MAXD && !seen[w]){ seen[w] = 1; n++; } });\n  return n >= 6;\n});\nfunction movieForDay(day){\n  const L = SC_LIST.length, cyc = Math.floor((day - 1) / L), pos = ((day - 1) % L + L) % L;\n  const perm = shuffle(SC_LIST.slice(), mulberry(0xC0FFEE ^ (cyc * 7919 + 1)));\n  return perm[pos];\n}\nfunction buildPuzzle(day){\n  const mv = MOVIES[movieForDay(day)];\n  const r = mulberry((day * 2654435761) ^ 0x57A2C705);\n  const seen = {}, pool = [];\n  mv[3].forEach(n => {\n    const w = wordFor(n);\n    if(w.length >= 3 && w.length \u003c= MAXD && !seen[w]){ seen[w] = 1; pool.push({ name:n.split('|')[0], w }); }\n  });\n  let lay = layout(pool.slice(0, 9), r);\n  for(let tries = 0; lay.placed.length \u003c 5 && tries \u003c 6; tries++){   // rare: retry with the wider cast\n    const alt = layout(shuffle(pool.slice(), r).slice(0, 10), r);\n    if(alt.placed.length > lay.placed.length) lay = alt;\n  }\n  // Slots, numbered in reading order like a real crossword\n  const starts = lay.placed.map(p => p.r * lay.cols + p.c);\n  const order = Array.from(new Set(starts)).sort((a, b) => a - b);\n  const slots = lay.placed.map(p => ({ r:p.r, c:p.c, dir:p.dir, len:pool[p.i].w.length,\n    num:order.indexOf(p.r * lay.cols + p.c) + 1 }));\n  const bank = shuffle(lay.placed.map((_, k) => k), r);       // bank order != slot order\n  return {\n    day, rows:lay.rows, cols:lay.cols,\n    movie:{ t:mv[0], y:mv[1], s:mv[2] },\n    slots,\n    words:bank.map(k => pool[lay.placed[k].i]),\n    sol:bank.map(k => k)\n  };\n}\n/* ==PURE-END== */\n\n\n/* Board size for browsers without CSS min() (older smart TVs) - mirrors the --bs media rules */\n(function(){\n  if(window.CSS && CSS.supports && CSS.supports('width', 'min(1px, 2px)')) return;\n  function fit(){\n    var w = window.innerWidth, h = window.innerHeight, v;\n    if(w >= 1600) v = Math.min(760, .64 * h);\n    else if(w >= 960) v = Math.min(540, .64 * h, .52 * w);\n    else if(h \u003c= 600 && w > h && w >= 560) v = Math.min(.82 * h, .46 * w);\n    else v = Math.min(.92 * w, 540);\n    document.documentElement.style.setProperty('--bs', Math.floor(v) + 'px');\n  }\n  fit(); window.addEventListener('resize', fit);\n})();\n\n/* ---------- Helpers ---------- */\nconst MS_DAY = 86400000;\nconst $ = s => document.querySelector(s);\nconst esc = str => String(str).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst localMidnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();\nconst parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).getTime(); };\nconst toISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\nconst dayNumberFor = d => Math.round((localMidnight(d) - parseISO(START_DATE)) / MS_DAY) + 1;\nconst dateForDay = n => { const b = new Date(parseISO(START_DATE)); return new Date(b.getFullYear(), b.getMonth(), b.getDate() + n - 1); };\nconst isoForDay = n => toISO(dateForDay(n));\nconst fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2,'0');\nconst longDate = d => d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', year:'numeric' });\nconst shortDate = d => d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });\n\nconst cache = {};\nconst puzzleForDay = n => cache[n] || (cache[n] = prepare(buildPuzzle(n)));\n\n/* Index which slots run through each cell */\nfunction prepare(p){\n  p.cellSlots = Array.from({ length:p.rows * p.cols }, () => []);\n  p.slots.forEach((s, si) => {\n    s.cells = [];\n    for(let k = 0; k \u003c s.len; k++){\n      const c = (s.r + (s.dir ? k : 0)) * p.cols + s.c + (s.dir ? 0 : k);\n      s.cells.push(c);\n      p.cellSlots[c].push({ s:si, pos:k });\n    }\n  });\n  p.starts = {};\n  p.slots.forEach(s => { p.starts[s.cells[0]] = s.num; });\n  return p;\n}\n\n/* ---------- Storage ---------- */\nconst blankStore = () => ({ results:{}, progress:{}, streak:0, best:0, solved:0, lastPlayedISO:null });\nfunction loadStore(){\n  try{ const raw = localStorage.getItem(STORE_KEY); return raw ? Object.assign(blankStore(), JSON.parse(raw)) : blankStore(); }\n  catch(e){ return blankStore(); }\n}\nfunction saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }\nfunction displayStreak(){\n  if(!store.lastPlayedISO) return 0;\n  const y = toISO(new Date(parseISO(todayISO) - MS_DAY));\n  return (store.lastPlayedISO === todayISO || store.lastPlayedISO === y) ? store.streak : 0;\n}\n\n/* ---------- State ---------- */\nconst today = new Date();\nconst todayISO = toISO(today);\nconst todayDay = Math.max(1, dayNumberFor(today));\nlet store = loadStore();\nlet P = null, iso = '', dayN = 0, isToday = true;\nlet st = null;            // { at:[slot|-1 per word], locked:[word idx], hints, elapsed }\nlet sel = -1, done = false, replay = false;\nlet timerId = null, countdownId = null;\n\nconst isTouch = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;\nfunction softFocus(el){ if(!el || (isTouch && !IS_TV)) return; try{ el.focus({ preventScroll:true }); }catch(e){} }\nfunction pinToTop(el){\n  if(!el) return; let f = 0;\n  const hold = () => { el.scrollTop = 0; if(++f \u003c 8) requestAnimationFrame(hold); };\n  hold(); setTimeout(() => { el.scrollTop = 0; }, 120); setTimeout(() => { el.scrollTop = 0; }, 420);\n}\nfunction scrollToEl(screen, el){\n  if(!screen || !el) return;\n  requestAnimationFrame(() => requestAnimationFrame(() => {\n    const top = Math.max(0, el.offsetTop - 12);\n    try{ screen.scrollTo({ top, behavior:'smooth' }); }catch(e){ screen.scrollTop = top; }\n  }));\n}\n\n/* ---------- Landing ---------- */\nfunction paintLanding(){\n  $('#landingDate').textContent = longDate(today);\n  $('#statStreak').textContent = displayStreak();\n  $('#statBest').textContent = store.best;\n  $('#statSolved').textContent = store.solved;\n  const r = store.results[todayISO];\n  if(r){\n    $('#startBtn').textContent = 'Review today\\u2019s grid';\n    $('#landingTag').textContent = 'Solved in ' + fmtTime(r.t) + '. Come back tomorrow for a new feature.';\n  }else{\n    $('#startBtn').textContent = store.progress[todayISO] ? 'Continue today' : 'Play today';\n    $('#landingTag').textContent = 'One movie. Its biggest stars. Cross them all into the grid.';\n  }\n}\n\n/* ---------- Board ---------- */\nconst isLocked = w => st.locked.indexOf(w) >= 0;\nconst occupant = s => st.at.indexOf(s);\nconst wordLen = w => P.words[w].w.length;\n\nfunction buildBoard(){\n  const b = $('#board');\n  b.style.setProperty('--cols', P.cols);\n  b.style.setProperty('--rows', P.rows);\n  b.style.setProperty('--maxd', Math.max(P.rows, P.cols));\n  let html = '';\n  for(let c = 0; c \u003c P.rows * P.cols; c++){\n    if(!P.cellSlots[c].length){ html += '\u003cdiv class=\"blank\">\u003c/div>'; continue; }\n    html += '\u003cbutton class=\"cell\" type=\"button\" data-cell=\"' + c + '\">' +\n      (P.starts[c] ? '\u003cspan class=\"num\">' + P.starts[c] + '\u003c/span>' : '') + '\u003cspan class=\"ch\">\u003c/span>\u003c/button>';\n  }\n  b.innerHTML = html;\n  b.querySelectorAll('.cell').forEach(btn => {\n    const c = Number(btn.dataset.cell);\n    btn.addEventListener('click', () => { if(clickSuppressed()) return; tapCell(c); });\n    btn.addEventListener('pointerdown', e => cellPointerDown(e, c));\n  });\n  $('#movieName').textContent = P.movie.t;\n  $('#movieMeta').textContent = P.movie.y + ' \\u00B7 ' + P.movie.s + ' \\u00B7 ' + P.words.length + ' stars to place';\n  $('#tray').innerHTML = P.words.map((w, i) =>\n    '\u003cbutton class=\"star\" type=\"button\" data-w=\"' + i + '\">' +\n      '\u003cspan class=\"len\">' + w.w.length + '\u003c/span>' +\n      '\u003cspan class=\"who\">\u003cspan class=\"nm\">' + esc(w.name) + '\u003c/span>\u003cspan class=\"wd\">' + esc(w.w) + '\u003c/span>\u003c/span>' +\n      '\u003cspan class=\"tick\">\\u2714\u003c/span>' + (i \u003c 9 ? '\u003cspan class=\"key\">' + (i + 1) + '\u003c/span>' : '') + '\u003c/button>').join('');\n  document.querySelectorAll('.star').forEach(btn => {\n    const w = Number(btn.dataset.w);\n    btn.addEventListener('click', () => { if(clickSuppressed()) return; selectWord(w); });\n    btn.addEventListener('pointerdown', e => starPointerDown(e, w));\n  });\n}\n\n/* Letters on the grid, plus any crossings that disagree */\nfunction evaluate(){\n  const letters = new Array(P.rows * P.cols).fill(null);\n  const conf = new Set(), badWords = new Set(), owner = {};\n  st.at.forEach((s, w) => {\n    if(s \u003c 0) return;\n    P.slots[s].cells.forEach((c, k) => {\n      const ch = P.words[w].w[k];\n      if(letters[c] === null){ letters[c] = ch; owner[c] = w; }\n      else if(letters[c] !== ch){ conf.add(c); badWords.add(w); badWords.add(owner[c]); }\n    });\n  });\n  return { letters, conf, badWords };\n}\n\nfunction paint(){\n  const ev = evaluate();\n  const lockedCells = new Set(), fit = new Set();\n  st.locked.forEach(w => { if(st.at[w] >= 0) P.slots[st.at[w]].cells.forEach(c => lockedCells.add(c)); });\n  if(sel >= 0 && !done) P.slots.forEach(s => { if(s.len === wordLen(sel)) s.cells.forEach(c => fit.add(c)); });\n  document.querySelectorAll('.cell').forEach(btn => {\n    const c = Number(btn.dataset.cell), ch = ev.letters[c];\n    const span = btn.querySelector('.ch');\n    if(span.textContent !== (ch || '')) span.textContent = ch || '';\n    btn.classList.toggle('filled', !!ch);\n    btn.classList.toggle('hint', lockedCells.has(c));\n    btn.classList.toggle('bad', ev.conf.has(c));\n    btn.classList.toggle('fits', fit.has(c));\n    btn.classList.toggle('win', done);\n    btn.disabled = done;\n    const across = P.cellSlots[c].map(x => (P.slots[x.s].dir ? 'down' : 'across')).join(' and ');\n    btn.setAttribute('aria-label', 'Row ' + (Math.floor(c / P.cols) + 1) + ', column ' + (c % P.cols + 1) +\n      ', ' + across + (ch ? ', letter ' + ch : ', empty'));\n  });\n  document.querySelectorAll('.star').forEach(btn => {\n    const w = Number(btn.dataset.w);\n    btn.classList.toggle('sel', w === sel);\n    btn.classList.toggle('placed', st.at[w] >= 0);\n    btn.classList.toggle('bad', ev.badWords.has(w));\n    btn.disabled = done || isLocked(w);\n  });\n  $('#hintBtn').disabled = done;\n  $('#resetBtn').disabled = done;\n  return ev;\n}\nfunction setMsg(t, good){ const m = $('#msg'); m.textContent = t || ''; m.classList.toggle('good', !!good); }\n\n/* Which space should word w go into if dropped/tapped on cell c? */\nfunction slotFor(c, w){\n  const cands = P.cellSlots[c].filter(x => P.slots[x.s].len === wordLen(w));\n  if(!cands.length) return -1;\n  let best = -1, bestScore = -Infinity;\n  cands.forEach(x => {\n    const sc = (x.pos === 0 ? 4 : 0) + (occupant(x.s) \u003c 0 ? 2 : 0) + (P.slots[x.s].dir === 0 ? 1 : 0) - (st.at[w] === x.s ? 10 : 0);\n    if(sc > bestScore){ bestScore = sc; best = x.s; }\n  });\n  return best;\n}\nfunction wordsAt(c){\n  return P.cellSlots[c].map(x => occupant(x.s)).filter(w => w >= 0)\n    .sort((a, b) => P.slots[st.at[a]].dir - P.slots[st.at[b]].dir);\n}\nfunction placeWord(w, s){\n  const occ = occupant(s);\n  if(occ === w) return true;\n  if(occ >= 0 && isLocked(occ)){ setMsg('That space was revealed by a hint.'); return false; }\n  const from = st.at[w];\n  if(occ >= 0) st.at[occ] = from;                // swap, or send the old name back to the cast list\n  st.at[w] = s;\n  return true;\n}\nfunction noFitMsg(w){\n  setMsg(P.words[w].name + ' needs a ' + wordLen(w) + '-letter space.');\n}\n\n/* ---------- Tap interaction ---------- */\nfunction selectWord(w){\n  if(done || isLocked(w)) return;\n  sel = (sel === w) ? -1 : w;\n  setMsg(sel >= 0 ? 'Now tap a ' + wordLen(sel) + '-letter space for ' + P.words[sel].name + '.' : '');\n  paint();\n}\nfunction tapCell(c){\n  if(done) return;\n  if(sel >= 0){\n    const s = slotFor(c, sel);\n    if(s \u003c 0){ noFitMsg(sel); return; }\n    if(!placeWord(sel, s)) return;\n    sel = -1;\n    afterMove();\n    return;\n  }\n  const ws = wordsAt(c).filter(w => !isLocked(w));\n  if(!ws.length){\n    setMsg(wordsAt(c).length ? 'That name was revealed by a hint.' : 'Pick a star from the cast list, or drag one onto the grid.');\n    return;\n  }\n  sel = ws[0]; st.at[sel] = -1;                  // pick the name back up\n  afterMove();\n}\nfunction afterMove(){\n  saveProgress();\n  const ev = paint();\n  const all = st.at.every(s => s >= 0);\n  if(ev.conf.size) setMsg('Some crossing letters don\\u2019t match (shown in red).');\n  else if(all) win();\n  else if(sel >= 0) setMsg('Now tap a ' + wordLen(sel) + '-letter space for ' + P.words[sel].name + '.');\n  else setMsg('');\n}\nfunction hint(){\n  if(done) return;\n  const w = P.words.findIndex((_, k) => st.at[k] !== P.sol[k] && !isLocked(k));\n  if(w \u003c 0) return;\n  const s = P.sol[w], occ = occupant(s);\n  if(occ >= 0) st.at[occ] = -1;\n  st.at[w] = s;\n  if(!isLocked(w)) st.locked.push(w);\n  st.hints++;\n  if(sel === w) sel = -1;\n  afterMove();\n  if(!done) setMsg(P.words[w].name + ' goes in ' + P.slots[s].num + (P.slots[s].dir ? ' Down.' : ' Across.'), true);\n}\nfunction clearBoard(){\n  if(done) return;\n  st.at = st.at.map((s, w) => isLocked(w) ? s : -1);\n  sel = -1;\n  afterMove();\n}\n\n/* ---------- Drag & drop (pointer events: mouse, touch, pen) ----------\n   A press that never moves past the threshold is left to the click handler,\n   so taps work exactly as before. */\nconst DRAG_PX = 6;\nlet ptr = null, suppressUntil = 0;\nconst clickSuppressed = () => Date.now() \u003c suppressUntil;\nfunction cellAt(x, y){\n  const el = document.elementFromPoint(x, y);\n  const cell = el && el.closest ? el.closest('.cell') : null;\n  return cell && $('#board').contains(cell) ? Number(cell.dataset.cell) : -1;\n}\nfunction starPointerDown(e, w){\n  if(done || e.button > 0 || isLocked(w)) return;\n  startGesture(e, { word:w, fromGrid:false });\n}\nfunction cellPointerDown(e, c){\n  if(done || e.button > 0 || sel >= 0) return;   // with a name selected, a press is a tap\n  const ws = wordsAt(c).filter(w => !isLocked(w));\n  if(!ws.length) return;\n  startGesture(e, { word:ws[0], fromGrid:true });\n}\nfunction startGesture(e, g){\n  g.id = e.pointerId; g.x0 = e.clientX; g.y0 = e.clientY; g.moved = false; g.ghost = null; g.over = -1;\n  ptr = g;\n  window.addEventListener('pointermove', onPtrMove, { passive:false });\n  window.addEventListener('pointerup', onPtrUp);\n  window.addEventListener('pointercancel', onPtrCancel);\n}\nfunction clearDropMarks(){\n  document.querySelectorAll('.cell.drop-target,.cell.drop-bad').forEach(x => x.classList.remove('drop-target','drop-bad'));\n}\nfunction onPtrMove(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  if(!ptr.moved && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) \u003c DRAG_PX) return;\n  e.preventDefault();\n  const w = ptr.word;\n  if(!ptr.moved){\n    ptr.moved = true;\n    sel = -1; paint();\n    const g = document.createElement('div');\n    g.className = 'drag-ghost';\n    g.textContent = P.words[w].w;\n    document.body.appendChild(g);\n    ptr.ghost = g;\n    document.body.classList.add('is-dragging');\n    const src = document.querySelector('.star[data-w=\"' + w + '\"]');\n    if(src) src.classList.add('dragging');\n    if(st.at[w] >= 0) P.slots[st.at[w]].cells.forEach(c => {\n      const el = document.querySelector('.cell[data-cell=\"' + c + '\"]'); if(el) el.classList.add('lifted');\n    });\n    setMsg('Drop ' + P.words[w].name + ' on a ' + wordLen(w) + '-letter space' + (st.at[w] >= 0 ? ', or off the grid to remove.' : '.'));\n  }\n  const gw = ptr.ghost.offsetWidth, gh = ptr.ghost.offsetHeight;\n  ptr.ghost.style.transform = 'translate3d(' + (e.clientX - gw / 2) + 'px,' + (e.clientY - gh - 18) + 'px,0)';\n  const c = cellAt(e.clientX, e.clientY);\n  if(c === ptr.over) return;\n  ptr.over = c;\n  clearDropMarks();\n  if(c \u003c 0) return;\n  const s = slotFor(c, w);\n  if(s \u003c 0){ document.querySelector('.cell[data-cell=\"' + c + '\"]').classList.add('drop-bad'); return; }\n  const occ = occupant(s), blocked = occ >= 0 && occ !== w && isLocked(occ);\n  P.slots[s].cells.forEach(x => document.querySelector('.cell[data-cell=\"' + x + '\"]').classList.add(blocked ? 'drop-bad' : 'drop-target'));\n}\nfunction endGesture(){\n  window.removeEventListener('pointermove', onPtrMove);\n  window.removeEventListener('pointerup', onPtrUp);\n  window.removeEventListener('pointercancel', onPtrCancel);\n  if(ptr && ptr.ghost) ptr.ghost.remove();\n  document.body.classList.remove('is-dragging');\n  clearDropMarks();\n  document.querySelectorAll('.star.dragging').forEach(x => x.classList.remove('dragging'));\n  document.querySelectorAll('.cell.lifted').forEach(x => x.classList.remove('lifted'));\n  ptr = null;\n}\nfunction onPtrCancel(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  endGesture(); paint();\n}\nfunction onPtrUp(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  const g = ptr;\n  if(!g.moved){ endGesture(); return; }          // plain tap: click handler runs\n  suppressUntil = Date.now() + 400;\n  const c = cellAt(e.clientX, e.clientY);\n  endGesture();\n  const w = g.word;\n  if(c \u003c 0){\n    if(st.at[w] >= 0){ st.at[w] = -1; afterMove(); }\n    else { setMsg(''); paint(); }\n    return;\n  }\n  const s = slotFor(c, w);\n  if(s \u003c 0){ paint(); noFitMsg(w); return; }\n  if(!placeWord(w, s)){ paint(); return; }\n  afterMove();\n}\n\n/* ---------- Progress / results ---------- */\nconst freshState = () => ({ at:P.words.map(() => -1), locked:[], hints:0, elapsed:0 });\nfunction saveProgress(){\n  if(replay || store.results[iso]) return;\n  store.progress[iso] = st; saveStore();\n}\nfunction recordWin(){\n  if(store.results[iso]) return;\n  if(isToday){\n    const y = toISO(new Date(parseISO(iso) - MS_DAY));\n    store.streak = (store.lastPlayedISO === y && store.streak > 0) ? store.streak + 1 : 1;\n    store.best = Math.max(store.best, store.streak);\n    store.lastPlayedISO = iso;\n  }\n  store.solved++;\n  store.results[iso] = { t:st.elapsed, h:st.hints, at:st.at.slice(), archive:!isToday };\n  delete store.progress[iso];\n  saveStore();\n}\nfunction startTimer(){\n  clearInterval(timerId);\n  $('#timer').textContent = fmtTime(st.elapsed);\n  timerId = setInterval(() => {\n    if(document.hidden) return;\n    st.elapsed++;\n    $('#timer').textContent = fmtTime(st.elapsed);\n    if(st.elapsed % 5 === 0) saveProgress();\n  }, 1000);\n}\nfunction win(){\n  done = true; sel = -1;\n  clearInterval(timerId);\n  if(!replay) recordWin();\n  setMsg('');\n  paint();\n  renderSolution();\n  confetti();\n  scrollToEl($('#game'), $('#solutionSlot'));\n}\nfunction confetti(){\n  const cols = ['#ffc83d','#ff4f9a','#33d6ff','#22c97a','#9b7bff'];\n  for(let i = 0; i \u003c 80; i++){\n    const c = document.createElement('i');\n    c.className = 'confetti';\n    c.style.left = Math.random() * 100 + 'vw';\n    c.style.background = cols[i % cols.length];\n    c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';\n    c.style.animationDelay = Math.random() * .8 + 's';\n    document.body.appendChild(c);\n    setTimeout(() => c.remove(), 6000);\n  }\n}\nfunction renderSolution(){\n  const res = store.results[iso];\n  const time = replay ? st.elapsed : res.t, hints = replay ? st.hints : res.h;\n  const list = P.words.map((w, i) => ({ w, s:P.slots[st.at[i] >= 0 ? st.at[i] : P.sol[i]] }))\n    .sort((a, b) => a.s.num - b.s.num || a.s.dir - b.s.dir)\n    .map(x => '\u003cli>\u003cb>' + x.s.num + (x.s.dir ? ' Down' : ' Across') + '\u003c/b>' + esc(x.w.name) + '\u003c/li>').join('');\n  const banner = replay ? 'Replay \\u00B7 your original result is kept'\n    : isToday ? '\\u{1F525} Streak: ' + displayStreak() + (displayStreak() === 1 ? ' day' : ' days') + ' \\u00B7 Solved ' + store.solved\n    : '\\u{1F5C3} Archive puzzle \\u00B7 streak untouched \\u00B7 Solved ' + store.solved;\n  $('#solutionSlot').innerHTML =\n    '\u003csection class=\"solution\">' +\n      '\u003cp class=\"verdict-line\">That\\u2019s a wrap!\u003c/p>' +\n      '\u003cp class=\"sub\">' + esc(P.movie.t) + ' (' + P.movie.y + ') \\u00B7 solved in ' + fmtTime(time) + ' \\u00B7 ' +\n        (hints ? hints + (hints === 1 ? ' hint' : ' hints') : 'no hints') + '\u003c/p>' +\n      '\u003ch4>Starring\u003c/h4>\u003cul class=\"cast\">' + list + '\u003c/ul>' +\n      '\u003cdiv class=\"streak-banner\">' + banner + '\u003c/div>' +\n      '\u003cdiv class=\"actions\">' +\n        '\u003cbutton id=\"shareBtn\" class=\"btn\" type=\"button\">Share result\u003c/button>' +\n        '\u003cbutton id=\"againBtn\" class=\"btn\" type=\"button\">Play again\u003c/button>' +\n        '\u003cbutton id=\"archiveBtn\" class=\"btn\" type=\"button\">Previous days\u003c/button>' +\n        '\u003cbutton id=\"homeBtn\" class=\"btn primary\" type=\"button\">Back home\u003c/button>' +\n      '\u003c/div>' +\n      (isToday ? '\u003cp class=\"next-in\">Next feature in \u003cspan id=\"countdown\">--:--:--\u003c/span>\u003c/p>'\n               : '\u003cp class=\"next-in\">Day ' + String(dayN).padStart(3,'0') + ' complete\u003c/p>') +\n    '\u003c/section>';\n  $('#shareBtn').addEventListener('click', share);\n  $('#againBtn').addEventListener('click', playAgain);\n  $('#archiveBtn').addEventListener('click', () => openArchive());\n  $('#homeBtn').addEventListener('click', goHome);\n  if(isToday) startCountdown();\n}\nfunction playAgain(){\n  replay = true; done = false; sel = -1;\n  st = freshState();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('Replay \\u2014 this won\\u2019t change your stats.', true);\n  paint(); startTimer();\n  pinToTop($('#game'));\n}\n\n/* ---------- Share (secure-context aware, with fallbacks) ---------- */\nfunction resultText(day, p, res){\n  let grid = '';\n  for(let r = 0; r \u003c p.rows; r++){\n    for(let c = 0; c \u003c p.cols; c++) grid += p.cellSlots[r * p.cols + c].length ? '\\u{1F7E8}' : '\\u2B1B';\n    grid += '\\n';\n  }\n  return 'Star Crossed #' + day + '\\n\\u{1F3AC} ' + p.words.length + ' stars crossed in ' + fmtTime(res.t) + ' \\u00B7 ' +\n    (res.h ? res.h + ' hint' + (res.h > 1 ? 's' : '') : 'no hints') + '\\n' + grid.trim();\n}\nfunction sendShare(text, btnId, label){\n  var isWeb = /^https?:$/.test(UMG_HOST.protocol);\n  var payload = isWeb ? text + '\\n' + UMG_HOST.url : text;\n  function legacyCopy(){\n    try{\n      var ta = document.createElement('textarea');\n      ta.value = payload; ta.setAttribute('readonly','');\n      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';\n      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, payload.length);\n      var ok = document.execCommand('copy'); document.body.removeChild(ta);\n      if(ok){ flash(btnId, label); return; }\n    }catch(e){}\n    window.prompt('Copy and share:', payload);\n  }\n  function clip(){\n    if(navigator.clipboard && window.isSecureContext){\n      navigator.clipboard.writeText(payload).then(function(){ flash(btnId, label); }, legacyCopy);\n    }else legacyCopy();\n  }\n  if(navigator.share && isWeb){\n    navigator.share({ title:'Star Crossed', text:text, url:UMG_HOST.url }).catch(function(err){ if(!err || err.name !== 'AbortError') clip(); });\n    return;\n  }\n  clip();\n}\nfunction share(){\n  const res = store.results[iso]; if(!res) return;\n  sendShare(resultText(dayN, P, res), '#shareBtn', 'Share result');\n}\nfunction shareLanding(){\n  const res = store.results[todayISO], streak = displayStreak();\n  const text = res\n    ? resultText(todayDay, puzzleForDay(todayDay), res) + (streak ? '\\n\\u{1F525} Streak: ' + streak : '')\n    : '\\u{1F3AC} Star Crossed #' + todayDay + '\\nOne movie. Its biggest stars. Can you cross them all into the grid?' +\n      (streak ? '\\n\\u{1F525} My streak: ' + streak : '');\n  sendShare(text, '#landingShareBtn', 'Share');\n}\nfunction flash(btnId, label){\n  const b = $(btnId); if(!b) return;\n  b.textContent = 'Copied!';\n  setTimeout(() => { const s = $(btnId); if(s) s.textContent = label; }, 2500);\n}\n\nfunction startCountdown(){\n  clearInterval(countdownId);\n  const tick = () => {\n    const now = new Date();\n    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime();\n    const d = Math.max(0, next - now.getTime());\n    const el = $('#countdown');\n    if(el) el.textContent = [Math.floor(d / 3600000), Math.floor(d % 3600000 / 60000), Math.floor(d % 60000 / 1000)]\n      .map(n => String(n).padStart(2,'0')).join(':');\n  };\n  tick(); countdownId = setInterval(tick, 1000);\n}\n\n/* ---------- Screens ---------- */\nfunction show(id){\n  document.body.classList.toggle('on-landing', id === 'landing');   // footer only on the landing page\n  ['landing','game','archive'].forEach(s => {\n    const el = document.getElementById(s);\n    if(s === id){ el.classList.remove('hidden-left','hidden-right'); }\n    else if(!el.classList.contains('hidden-left') && !el.classList.contains('hidden-right')){\n      el.classList.add(s === 'landing' ? 'hidden-left' : 'hidden-right');\n    }\n  });\n  pinToTop(document.getElementById(id));\n}\nfunction openDay(n){\n  if(ptr) endGesture();\n  clearInterval(countdownId); clearInterval(timerId);\n  dayN = n; iso = isoForDay(n); isToday = (n === todayDay);\n  P = puzzleForDay(n);\n  sel = -1; replay = false;\n  $('#dayNo').textContent = 'Day ' + String(n).padStart(3,'0') + ' \\u00B7 ' + shortDate(dateForDay(n));\n  const flag = $('#archiveFlag');\n  flag.classList.toggle('on', !isToday);\n  flag.textContent = isToday ? '' : '\\u{1F5C3} From the archive \\u00B7 ' + longDate(dateForDay(n)) + ' \\u00B7 does not affect your streak';\n  buildBoard();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('');\n  const res = store.results[iso];\n  if(res){\n    done = true;\n    st = freshState();\n    st.at = (res.at && res.at.length === P.words.length) ? res.at.slice() : P.sol.slice();\n    st.elapsed = res.t; st.hints = res.h;\n    $('#timer').textContent = fmtTime(res.t);\n    paint(); renderSolution();\n  }else{\n    done = false;\n    const saved = store.progress[iso];\n    st = (saved && saved.at && saved.at.length === P.words.length) ? Object.assign(freshState(), saved) : freshState();\n    paint(); startTimer();\n  }\n  show('game');\n  setTimeout(() => softFocus(document.querySelector('.star:not(:disabled)')), 500);\n}\nfunction buildArchive(){\n  const cards = []; let solved = 0, prog = 0, open = 0;\n  for(let n = todayDay; n >= 1; n--){\n    const d = isoForDay(n), mv = MOVIES[movieForDay(n)], res = store.results[d], pr = store.progress[d];\n    const isT = n === todayDay;\n    let cls, label;\n    if(res){ solved++; cls = 'solved'; label = 'Solved \\u00B7 ' + fmtTime(res.t); }\n    else if(pr){ prog++; cls = 'progress'; label = isT ? 'Today \\u00B7 in progress' : 'In progress'; }\n    else if(isT){ open++; cls = 'today'; label = 'Today\\u2019s feature'; }\n    else{ open++; cls = 'unplayed'; label = 'Unplayed \\u00B7 play now'; }\n    cards.push('\u003cbutton class=\"day-card' + (isT ? ' is-today' : '') + '\" type=\"button\" data-day=\"' + n + '\">' +\n      '\u003cspan class=\"dc-no\">Day ' + String(n).padStart(3,'0') + ' \\u00B7 ' + esc(shortDate(dateForDay(n))) + '\u003c/span>' +\n      '\u003cspan class=\"dc-title\">' + esc(mv[0]) + '\u003c/span>' +\n      '\u003cspan class=\"dc-meta\">' + mv[1] + ' \\u00B7 ' + esc(mv[2]) + '\u003c/span>' +\n      '\u003cspan class=\"dc-status ' + cls + '\">' + label + '\u003c/span>\u003c/button>');\n  }\n  $('#archiveGrid').innerHTML = cards.join('');\n  $('#arcSolved').textContent = solved; $('#arcProgress').textContent = prog; $('#arcOpen').textContent = open;\n  document.querySelectorAll('.day-card').forEach(b => b.addEventListener('click', () => openDay(Number(b.dataset.day))));\n}\nfunction openArchive(){\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  buildArchive(); show('archive');\n  setTimeout(() => softFocus(document.querySelector('.day-card')), 500);\n}\nfunction goHome(){\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  paintLanding(); show('landing');\n  setTimeout(() => softFocus($('#startBtn')), 450);\n}\n\n/* ---------- Background video: keep it running, hide on failure ---------- */\nconst bgv = $('#bgVideo');\nfunction kickVideo(){\n  if(!bgv || bgv.classList.contains('failed')) return;\n  bgv.muted = true;\n  if(bgv.paused){ const p = bgv.play(); if(p && p.catch) p.catch(() => {}); }\n}\nbgv.addEventListener('error', () => bgv.classList.add('failed'), true);\n['loadedmetadata','canplay','stalled','pause'].forEach(e => bgv.addEventListener(e, kickVideo));\ndocument.addEventListener('visibilitychange', () => { if(!document.hidden) kickVideo(); });\n['pointerdown','touchstart','keydown'].forEach(e => window.addEventListener(e, kickVideo, { passive:true }));\nkickVideo();\n\n/* ---------- Keyboard / TV remote ---------- */\ndocument.addEventListener('keydown', e => {\n  const gameOn = !$('#game').classList.contains('hidden-right') && !$('#game').classList.contains('hidden-left');\n  const ae = document.activeElement;\n  const onCell = ae && ae.dataset && ae.dataset.cell !== undefined;\n  if(gameOn && !done){\n    if(/^[1-9]$/.test(e.key) && Number(e.key) \u003c= P.words.length){ selectWord(Number(e.key) - 1); return; }\n    if(e.key === 'Escape'){ sel = -1; setMsg(''); paint(); return; }\n    if((e.key === 'Backspace' || e.key === 'Delete') && onCell){\n      const ws = wordsAt(Number(ae.dataset.cell)).filter(w => !isLocked(w));\n      if(ws.length){ st.at[ws[0]] = -1; afterMove(); }\n      e.preventDefault(); return;\n    }\n  }\n  const dirs = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] };\n  const d = dirs[e.key]; if(!d) return;\n  // Move between letter squares, skipping the empty spaces\n  if(gameOn && onCell){\n    const c = Number(ae.dataset.cell);\n    let r = Math.floor(c / P.cols) + d[0], col = c % P.cols + d[1];\n    while(r >= 0 && r \u003c P.rows && col >= 0 && col \u003c P.cols){\n      const t = document.querySelector('.cell[data-cell=\"' + (r * P.cols + col) + '\"]');\n      if(t){\n        e.preventDefault();\n        try{ t.focus({ preventScroll:true }); }catch(err){ t.focus(); }\n        if(t.scrollIntoView) t.scrollIntoView({ block:'nearest', behavior:'smooth' });\n        return;\n      }\n      r += d[0]; col += d[1];\n    }\n  }\n  const list = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'));\n  if(!list.length) return;\n  e.preventDefault();\n  const i = list.indexOf(ae);\n  const fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';\n  const next = i === -1 ? list[0] : list[(i + (fwd ? 1 : -1) + list.length) % list.length];\n  try{ next.focus({ preventScroll:true }); }catch(err){ next.focus(); }\n  if(next.scrollIntoView) next.scrollIntoView({ block:'nearest', behavior:'smooth' });\n});\n\n/* Save the clock if the tab is closed or backgrounded mid-puzzle */\ndocument.addEventListener('visibilitychange', () => { if(document.hidden && st && !done) saveProgress(); });\nwindow.addEventListener('pagehide', () => { if(st && !done) saveProgress(); });\n\n\n/* ----------
